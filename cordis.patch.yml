# 此 bundle 必须安装在 dsh-web-app 之后。它覆盖权限预设表，并在 Web
# 人工审批应答器之前插入模型审查器：审查通过（allow）的动作由插件自动放行，
# 其余结果（模型拒绝、宿主安全降级、审查失败）一律交回 Web 人工审批。

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
      auto-approve:
        sandbox: workspace-write
        approval: ask
        name: 自动审批
        description: 在工作区写入沙箱内自动放行审查通过的操作，其余一律转交人工审批。
      danger-full-access:
        sandbox: danger-full-access
        approval: never

- insert:
    - id: dsh-auto-pass
      name: dsh-auto-pass
      config:
        language: auto
        reviewerProvider: deepseek-official
        reviewerModel: deepseek-v4-flash
        reviewerReasoningEffort: high
        timeoutMs: 90000
        maxInvestigationSteps: 4
        maxMessageTranscriptTokens: 4000
        maxToolTranscriptTokens: 3000
        maxMessageEntryTokens: 1000
        maxToolEntryTokens: 512
        maxSystemInstructionTokens: 6000
        maxAgentInstructionTokens: 6000
        maxRecentNonUserEntries: 20
        maxActionChars: 16000
        maxOutputTokens: 8192
        # 审批记录：落盘 JSON 的条数上限；placement=auto|tab|sidebar|all
        # all（默认）两处都注册；auto 优先右侧栏 tab，没有座位时退回对话区标签页
        maxRecords: 1000
        placement: all
